# Makes every Log4j2 logger in this JVM asynchronous, backed by the
# LMAX Disruptor ring buffer, instead of only the loggers explicitly
# declared as <AsyncLogger>. This must be a JVM/classpath-level system
# property read before the Log4j2 context initializes, which is why it
# lives here rather than in log4j2.xml.
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
