<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 820" role="img" aria-label="Flow diagram of the standing order scheduler: a scheduled poll acquires a ShedLock so only one instance runs it, loads every active standing order, and for each one checks whether it is due by comparing its cron expression's next fire time (relative to its last successful run, or creation time) against now. A due order runs through the same transfer logic as a one-time transfer. On success, lastExecutedAt advances. On failure, lastExecutedAt is deliberately not advanced, so the order stays due and is retried on the next poll instead of being skipped. After every active order is checked, the scheduler waits for the next poll interval.">

  <style>
    .box-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; font-size: 13px; fill: #1C1E22; }
    .box-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #63656C; }
    .lane-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; fill: #63656C; }
    .boundary-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; font-size: 12.5px; fill: #34449A; }
    .boundary-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #63656C; font-style: italic; }
    .branch-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 11px; }
    .loop-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; fill: #63656C; font-style: italic; }
  </style>

  <rect x="0" y="0" width="670" height="820" fill="#F5F4EF"></rect>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C1E22"></path>
    </marker>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A5392B"></path>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#63656C"></path>
    </marker>
  </defs>

  <!-- SCHEDULER lane -->
  <rect x="10" y="40" width="640" height="176" rx="12" fill="#EBE8E0"></rect>
  <text class="lane-label" x="30" y="58">SCHEDULER</text>

  <rect x="60" y="72" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#CDC9BC"></rect>
  <text class="box-label" x="80" y="96">Scheduled poll fires</text>
  <text class="box-desc" x="80" y="114">every app.standing-order.poll-interval-ms (60s default)</text>

  <line x1="260" y1="130" x2="260" y2="146" stroke="#1C1E22" stroke-opacity="0.55" marker-end="url(#arrow)"></line>

  <rect x="60" y="148" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#CDC9BC"></rect>
  <text class="box-label" x="80" y="172">@SchedulerLock("standingOrderPoll")</text>
  <text class="box-desc" x="80" y="190">only one app instance runs this poll (ShedLock)</text>

  <!-- LOAD ORDERS lane -->
  <rect x="10" y="222" width="640" height="94" rx="12" fill="#EBE8E0"></rect>
  <text class="lane-label" x="30" y="240">LOAD ACTIVE ORDERS</text>

  <line x1="260" y1="206" x2="260" y2="252" stroke="#1C1E22" stroke-opacity="0.55" marker-end="url(#arrow)"></line>

  <rect x="60" y="254" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#CDC9BC"></rect>
  <text class="box-label" x="80" y="278">standingOrderRepository.findByActiveTrue()</text>
  <text class="box-desc" x="80" y="296">load every active standing order</text>

  <line x1="260" y1="312" x2="260" y2="338" stroke="#1C1E22" stroke-opacity="0.55" marker-end="url(#arrow)"></line>

  <!-- per-order loop boundary -->
  <rect x="30" y="330" width="580" height="400" rx="16" fill="rgba(52, 68, 154, 0.07)" stroke="#34449A" stroke-width="2" stroke-dasharray="7 6"></rect>
  <text class="boundary-label" x="50" y="354">For each active order, this poll cycle</text>
  <text class="boundary-sub" x="50" y="370">repeats until every active order has been checked</text>

  <!-- isDue -->
  <rect x="56" y="384" width="8" height="58" fill="#34449A"></rect>
  <rect x="60" y="384" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#34449A"></rect>
  <text class="box-label" x="80" y="408">isDue(order, now)?</text>
  <text class="box-desc" x="80" y="426">cron.next(lastExecutedAt or createdAt) ≤ now, in UTC</text>

  <line x1="260" y1="442" x2="260" y2="458" stroke="#1C1E22" stroke-opacity="0.55" marker-end="url(#arrow)"></line>
  <text class="branch-label" x="276" y="453" fill="#63656C" font-size="10">yes</text>

  <!-- execute -->
  <rect x="60" y="460" width="400" height="58" rx="8" fill="#FFFFFF" stroke="#CDC9BC"></rect>
  <text class="box-label" x="80" y="484">transferService.executeForStandingOrder(order)</text>
  <text class="box-desc" x="80" y="502">reuses the same logic as a one-time transfer</text>

  <line x1="260" y1="518" x2="260" y2="534" stroke="#1C1E22" stroke-opacity="0.55" marker-end="url(#arrow)"></line>

  <!-- success -->
  <rect x="60" y="536" width="400" height="58" rx="8" fill="rgba(30, 107, 68, 0.08)" stroke="#1E6B44" stroke-width="2"></rect>
  <text class="box-label" x="80" y="560" fill="#1E6B44">recordSuccess(now) + save(order)</text>
  <text class="box-desc" x="80" y="578">lastExecutedAt advances; failure message cleared</text>

  <!-- failure (reached via the "throws" branch, not sequentially after success) -->
  <rect x="60" y="628" width="400" height="58" rx="8" fill="rgba(165, 57, 43, 0.08)" stroke="#A5392B" stroke-width="2"></rect>
  <text class="box-label" x="80" y="652" fill="#A5392B">log.error(...) + recordFailure(message)</text>
  <text class="box-desc" x="80" y="670">lastExecutedAt NOT advanced -- stays due, retried next poll</text>

  <!-- "not due" skip branch: from isDue, around the right, down to the collector -->
  <polyline points="460,413 598,413 598,706" fill="none" stroke="#63656C" stroke-width="1.6" stroke-dasharray="5 5"></polyline>
  <text class="branch-label" x="466" y="403" fill="#63656C">no</text>
  <text class="box-desc" x="466" y="438" fill="#63656C">skip to next order</text>

  <!-- "throws" branch: from execute box to the failure box -->
  <polyline points="460,489 560,489 560,657 460,657" fill="none" stroke="#A5392B" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowDanger)"></polyline>
  <text class="branch-label" x="466" y="479" fill="#A5392B">throws</text>

  <!-- success exit: right and down to the collector, clear of the failure box -->
  <polyline points="260,594 260,602 500,602 500,706" fill="none" stroke="#1C1E22" stroke-opacity="0.55" stroke-dasharray="none"></polyline>

  <!-- failure exit: straight down to the collector -->
  <line x1="260" y1="686" x2="260" y2="706" stroke="#1C1E22" stroke-opacity="0.55"></line>

  <!-- collector: all three exits join here, then loop back up to isDue for the next order -->
  <polyline points="598,706 46,706 46,405 60,405" fill="none" stroke="#63656C" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowMuted)"></polyline>
  <text class="loop-label" x="46" y="620" transform="rotate(-90 46 620)" text-anchor="middle">next order in this poll</text>

  <!-- outer loop-back: wait for next scheduled poll, once every active order has been checked -->
  <text class="loop-label" x="335" y="746" text-anchor="middle">all active orders checked for this poll</text>
  <polyline points="335,730 335,760 16,760 16,101 58,101" fill="none" stroke="#63656C" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowMuted)"></polyline>
  <text class="loop-label" x="15" y="420" transform="rotate(-90 15 420)" text-anchor="middle">wait for next scheduled poll</text>

</svg>
